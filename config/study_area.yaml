# Everything that pins the build to one place and one data vintage.
name: Portland, Maine
state_fips: "23"
county_fips: "005"          # Cumberland County
place_fips: "60545"         # Portland city (checked against TIGER on fetch)
place_name: Portland
puma: "01000"               # Cumberland County (Southeast): Portland, South Portland & Westbrook
e911_town: Portland

vintages:
  acs: 2024                 # ACS 2020-2024 5-year
  pums: 2024                # PUMS 2020-2024 5-year
  tiger: 2024               # tracts, block groups, place (2020 geography)
  blocks: 2020              # 2020 Census blocks with POP20 / HOUSING20

model:
  replicates: 80            # PUMS replicate weight sets
  holdout_fraction: 0.2     # blocks hidden in the validation run
  random_seed: 20261022
