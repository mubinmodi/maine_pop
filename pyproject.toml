[project]
name = "synthpop"
version = "0.1.0"
description = "Parcel-level synthetic population for Portland, Maine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
synthpop = "synthpop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthpop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
